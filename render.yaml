services:
  - type: web
    name: the-seafood-house
    runtime: node
    plan: starter
    startCommand: node server.js
    envVars:
      - key: ADMIN_TOKEN
        sync: false
      - key: DATA_DIR
        value: /var/data
    disk:
      name: catch-data
      mountPath: /var/data
      sizeGB: 1
